version: '3.8'

services:
  # MySQL Database
  database:
    image: mysql:8.0
    container_name: wagesse-db
    environment:
      MYSQL_ROOT_PASSWORD: wagesse_root_dev
      MYSQL_USER: wagesse_user
      MYSQL_PASSWORD: wagesse_password_dev
      MYSQL_DATABASE: wagesse
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "wagesse_user", "-pwagesse_password_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis (pour sessions, cache, jobs)
  redis:
    image: redis:7-alpine
    container_name: wagesse-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Next.js Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wagesse-app
    environment:
      NODE_ENV: development
      DATABASE_URL: mysql://wagesse_user:wagesse_password_dev@database:3306/wagesse
      REDIS_URL: redis://redis:6379
      JWT_SECRET: super_secret_dev_key_change_in_production
      NEXT_PUBLIC_APP_NAME: Wagesse
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      PAYMENT_MODE: MANUAL
      PAYMENT_PROVIDER: orange_money_sandbox
    ports:
      - "3000:3000"
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev

  # Optional: Adminer for database management
  adminer:
    image: adminer:latest
    container_name: wagesse-adminer
    ports:
      - "8080:8080"
    depends_on:
      - database

volumes:
  mysql_data:
    driver: local
